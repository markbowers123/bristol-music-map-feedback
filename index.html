<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Mapping the West of England’s Music Industry. By Mark Bowers.">
<meta name="theme-color" content="#f5f4ee">
<title>Bristol Music Map | Sign in</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:32px 24px;background:#f5f4ee;color:#173c32;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:100%;max-width:760px;padding:44px 0;border-top:4px solid #397c65}.eyebrow{margin:0 0 22px;font-size:13px;font-weight:650;letter-spacing:.12em;text-transform:uppercase}h1{margin:0 0 20px;max-width:730px;font-size:clamp(38px,6.7vw,66px);font-weight:650;line-height:1.12;letter-spacing:-.045em}.byline{margin:0 0 44px;font-size:19px;color:#4e665b}form{max-width:400px}label{display:block;margin:0 0 10px;font-weight:600;font-size:15px}.entry{display:flex;gap:10px}input{min-width:0;width:100%;border:1px solid #a7b7ac;border-radius:8px;background:#fffdf7;padding:14px;font:inherit;color:#173c32}button{border:0;border-radius:8px;padding:14px 22px;background:#173c32;color:white;font:inherit;font-weight:600;white-space:nowrap;cursor:pointer}button:disabled{opacity:.6;cursor:wait}input:focus-visible,button:focus-visible{outline:3px solid #d7a737;outline-offset:3px}.help{margin:14px 0 0;color:#5b6b60;font-size:14px}.message{min-height:24px;margin:10px 0 0;font-size:14px;color:#983c28}@media(max-width:480px){main{padding:30px 0}.entry{flex-direction:column}.byline{margin-bottom:32px}}
</style>
</head>
<body>
<main>
<p class="eyebrow">Bristol Music Map</p>
<h1>Mapping the West of England’s Music Industry</h1>
<p class="byline">By Mark Bowers</p>
<form id="sign-in">
<label for="password">Password</label>
<div class="entry"><input id="password" type="password" autocomplete="current-password" required aria-describedby="message"><button id="submit" type="submit">Sign in</button></div>
<p class="help">For access contact Mark Bowers.</p>
<p id="message" class="message" role="status" aria-live="polite"></p>
</form>
<noscript>Enable JavaScript to sign in to the map.</noscript>
</main>
<script>
const form=document.getElementById('sign-in'),password=document.getElementById('password'),button=document.getElementById('submit'),message=document.getElementById('message');
const bytes=value=>Uint8Array.from(atob(value),c=>c.charCodeAt(0));
form.addEventListener('submit',async event=>{
  event.preventDefault();button.disabled=true;button.textContent='Opening…';message.textContent='';
  let payload;
  try{const response=await fetch('map.enc.json',{cache:'no-store'});if(!response.ok)throw new Error();payload=await response.json();}
  catch{message.textContent='The map could not load. Please try again.';button.disabled=false;button.textContent='Sign in';return;}
  try{
    const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password.value),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(payload.salt),iterations:payload.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
    const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(payload.iv)},key,bytes(payload.ciphertext));
    password.value='';document.open();document.write(new TextDecoder().decode(clear));document.close();
  }catch{message.textContent='That password is not correct. Please try again.';button.disabled=false;button.textContent='Sign in';password.focus();password.select();}
});
</script>
</body>
</html>
